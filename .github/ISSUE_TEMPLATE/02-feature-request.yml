name: Feature Request
description: Propose a new feature or enhancement
title: "[FEATURE]: <name of feature>"
labels:
  - triage
type: feature

body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Please provide as much detail as possible to help us evaluate feasibility, impact, and scope.

  - type: input
    id: summary
    attributes:
      label: Feature Summary
      description: A quick summary of the feature.
      placeholder: Add bulk export capability to search
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: |
        What problem does this feature solve?  
        Who is impacted? Include relevant workflows or constraints.
      placeholder: I'm always frustrated when [...]

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your preferred solution or behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative approaches or workarounds you have considered.

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Provide specific examples of how this feature would be used.

  - type: dropdown
    id: impact
    attributes:
      label: Business Impact
      description: How important is this feature?
      options:
        - Critical (blocks major workflow)
        - High (significant efficiency gain)
        - Medium (nice improvement)
        - Low (minor enhancement)
    validations:
      required: true

  - type: dropdown
    id: users-affected
    attributes:
      label: Users Affected
      description: Who would benefit from this feature?
      multiple: true
      options:
        - End Users
        - Administrators
        - Developers
        - Content Owners
        - Other

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Include screenshots, mockups, references, or related issues.

  - type: checkboxes
    id: term
    attributes:
      label: Confirmation
      description: Please confirm the following before submitting
      options:
        - label: I have searched existing issues to avoid duplicates.
          required: true
        - label: This request is aligned with the project’s scope and goals.
          required: true
